apiVersion: batch/v1
kind: Job
metadata:
  name: test-job
  annotation:
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    spec:
      containers:
        - name: test
          image: busybox
          env:
            - name: CONFIG_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: message
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "Configmap data: ${CONFIG_MESSAGE}"
              sleep 5
      restartPolicy: Never